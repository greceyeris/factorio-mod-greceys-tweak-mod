[mod-setting-description]
enable-allow-all-machines-use-all-modules=允许所有拥有模块槽的机器使用全部模块类别与模块效果
enable-allow-all-recipes-use-all-modules=允许全部配方使用全部模块类别与模块效果
enable-allow-select-quality-for-all-recipes=允许选择全部配方的品质
enable-always-day-mode-at-game-start=开局时为所有已存在的地表启用终为白日模式
enable-always-show-recipe-made-in=始终在配方信息中显示制造该配方的机器
enable-automatically-researches-worker-robots-speed-at-game-start=开局时自动研究前 5 级工作机器人速度科技
enable-clear-all-at-game-start=开局时清空角色全部库存和装备
enable-disable-inserter-overload=禁用机械臂向机器输入槽额外装填原料
enable-display-all-hidden-technologies=显示所有被隐藏的科技
enable-electric-furnaces=为原版石炉和钢炉注册对应的电力版本
enable-electric-pole-free-lighting-mode=为所有电线杆添加原版照明灯的照明效果
enable-furnace-recipe-selection=允许具有输入槽和输出槽的熔炉手动选择配方
enable-give-burner-mining-drill-at-game-start=开局时给予热能采矿机
enable-give-construction-kit-at-game-start=开局时给予建设机器人及配套盔甲和装备, 并清空盔甲
enable-give-weapon-at-game-start=开局时给予武器和弹药, 并清空原有武器
enable-infinite-resources=使所有可重复开采的资源变为无限资源, 并使开采产量保持为 100%
enable-mining-drill-item-filter-mode=为所有尚未支持物品过滤的采矿机添加物品过滤功能
enable-modify-all-equipment-grid-occupancy-sizes-to-one=修改全部装备在装备网格中的占用大小为 1×1
enable-optimize-technology-tree=移除可由其他前置科技递归满足的重复前置
enable-place-offshore-pumps-anywhere=允许抽水泵在原本没有流体属性的地块上放置并抽取水
enable-remove-achievement-restrictions=允许完成原本受限制的成就
enable-remove-all-recycling-recipes=移除全部使用回收配方类型的配方
enable-remove-crash-site-at-game-start=开局时移除坠机现场, 并清空默认给予的物品和坠机残骸中的物品
enable-remove-item-spoilage=移除所有物品的变质时间, 使物品不再变质
enable-remove-machine-freezing=移除所有机器的加热能量需求, 使机器不再冻结
enable-remove-pipeline-extent-limit=移除流体管网的规模限制
enable-show-farthest-distance-position=显示地下传送带和地下管道的最远距离位置
enable-void-chest-and-void-pipe=注册可持续销毁物品的虚空箱, 以及可持续销毁流体的虚空管
enable-waterfill=注册可以在陆地上放置水地块的物品, 配方和科技

enable-remove-decorations=移除新生成区块中的地面装饰物

enable-alt-mode-at-game-start=开局时启用 ALT 模式

adjust-character-crafting-speed-multiplier=调整角色的制造速度倍率
adjust-character-healing-per-tick-multiplier=调整角色的生命值自动恢复速度倍率
adjust-character-interaction-distance-multiplier=调整角色的建造距离, 一般交互距离与资源交互距离倍率
adjust-character-max-health-multiplier=调整角色的最大生命值倍率
adjust-character-mining-speed-multiplier=调整角色的采矿速度倍率
adjust-character-respawn-time-multiplier=调整角色的重生速度倍率, 数值越大, 重生所需时间越短
adjust-character-running-speed-multiplier=调整角色的移动速度倍率
adjust-inserter-speed-multiplier=调整机械臂旋转速度和伸缩速度的倍率
adjust-item-stack-size-multiplier=调整可堆叠物品的堆叠数量倍率
adjust-robot-speed-multiplier=调整物流机器人和建设机器人移动速度的倍率
adjust-transport-belt-speed-multiplier=调整传送带, 地下传送带, 分流器和装卸机等实体的速度倍率

