[mod-setting-description]
enable-allow-all-machines-use-all-modules=Allows all machines with module slots to use all module categories and module effects
enable-allow-all-recipes-use-all-modules=Allows all recipes to use all module categories and module effects
enable-allow-select-quality-for-all-recipes=Allows quality selection for all recipes
enable-always-day-mode-at-game-start=Enables always-day mode on all existing surfaces at game start
enable-always-show-recipe-made-in=Always show the machines that can craft the recipe in its information
enable-automatically-researches-worker-robots-speed-at-game-start=Automatically researches the first 5 levels of worker robot speed technologies at game start
enable-clear-all-at-game-start=Clears all player inventories and equipment at game start
enable-disable-inserter-overload=Prevents inserters from loading extra ingredients into machine input inventories
enable-display-all-hidden-technologies=Displays all hidden technologies
enable-electric-furnaces=Registers electric variants of the vanilla stone furnace and steel furnace
enable-electric-pole-free-lighting-mode=Adds the vanilla small lamp's lighting effect to all electric poles
enable-furnace-recipe-selection=Allows furnaces with both input and output inventories to select recipes manually
enable-give-burner-mining-drill-at-game-start=Gives the player a burner mining drill at game start
enable-give-construction-kit-at-game-start=Gives the player construction robots and the corresponding armor and equipment at game start, and clears the armor
enable-give-weapon-at-game-start=Gives the player a weapon and ammunition at game start, and clears the existing weapons
enable-infinite-resources=Makes all repeatedly mineable resources infinite and keeps their mining yield at 100%
enable-mining-drill-item-filter-mode=Adds item filtering support to all mining drills that do not already support it
enable-modify-all-equipment-grid-occupancy-sizes-to-one=Modifies the size occupied by all equipment in equipment grids to 1×1
enable-optimize-technology-tree=Removes redundant prerequisites that are already recursively satisfied by other prerequisites
enable-place-offshore-pumps-anywhere=Allows offshore pumps to be placed on tiles that originally have no fluid property and extract water from them
enable-remove-achievement-restrictions=Allows normally restricted achievements to be completed
enable-remove-all-recycling-recipes=Removes all recipes that use the recycling recipe category
enable-remove-crash-site-at-game-start=Removes the crash site and clears the default starting items and items contained in crash-site debris at game start
enable-remove-item-spoilage=Removes the spoil time from all items, preventing them from spoiling
enable-remove-machine-freezing=Removes the heating energy requirement from all machines, preventing them from freezing
enable-remove-pipeline-extent-limit=Removes the extent limit of fluid pipelines
enable-show-farthest-distance-position=Shows the furthest connection position for underground belts and underground pipes
enable-void-chest-and-void-pipe=Registers a void chest that continuously destroys items and a void pipe that continuously destroys fluids
enable-waterfill=Registers an item, recipe, and technology that can place water tiles on land


enable-remove-decorations=Removes ground decorations from newly generated chunks


enable-alt-mode-at-game-start=Enables ALT mode at game start


adjust-character-crafting-speed-multiplier=Adjusts the base crafting speed multiplier of character
adjust-character-healing-per-tick-multiplier=Adjusts the base health regeneration speed multiplier of character
adjust-character-interaction-distance-multiplier=Adjusts the base building distance, general interaction distance, and resource interaction distance multiplier of character
adjust-character-max-health-multiplier=Adjusts the base maximum health multiplier of character
adjust-character-mining-speed-multiplier=Adjusts the base mining speed multiplier of character
adjust-character-respawn-time-multiplier=Adjusts the base respawn speed multiplier of character, Higher values reduce the required respawn time
adjust-character-running-speed-multiplier=Adjusts the base running speed multiplier of character
adjust-inserter-speed-multiplier=Adjusts the rotation and extension speed multiplier of inserters
adjust-item-stack-size-multiplier=Adjusts the stack size multiplier of stackable items
adjust-robot-speed-multiplier=Adjusts the movement speed multiplier of logistic and construction robots
adjust-transport-belt-speed-multiplier=Adjusts the speed multiplier of transport belts, underground belts, splitters, loaders, and similar entities

